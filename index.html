<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <style>
        /* 1. 背景は薄いグレー */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* 薄いグレー */
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 90%;
            width: 500px;
        }

        /* 2. 画面中央に大きな文字で『心理学実験室へようこそ』 */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            word-break: keep-all;
        }

        /* 3. 『実験を開始する』という青いボタン */
        .start-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #007bff; /* 青色 */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        }

        .start-button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .start-button:active {
            transform: translateY(0);
        }

        /* カスタムアラート（alert()の代わり） */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .close-btn {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>心理学実験室へようこそ</h1>
        <button id="startBtn" class="start-button">実験を開始する</button>
    </div>

    <!-- カスタムメッセージボックス（alert()の代替） -->
    <div id="overlay"></div>
    <div id="custom-alert">
        <p id="alertMessage" style="font-size: 1.2rem; font-weight: bold;"></p>
        <button class="close-btn" onclick="closeAlert()">閉じる</button>
    </div>

    <script>
        // 4. ボタンを押すと、アラート（メッセージ）を表示
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');
        const customAlert = document.getElementById('custom-alert');
        const alertMessage = document.getElementById('alertMessage');

        startBtn.addEventListener('click', () => {
            showAlert('Hello World!');
        });

        function showAlert(msg) {
            alertMessage.textContent = msg;
            overlay.style.display = 'block';
            customAlert.style.display = 'block';
        }

        function closeAlert() {
            overlay.style.display = 'none';
            customAlert.style.display = 'none';
        }

        // 背景クリックでも閉じるように設定
        overlay.addEventListener('click', closeAlert);
    </script>
</body>
</html>
