<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尚絅学院大学 2412A22の心理学者のたまご研究所🐣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fff9f0; font-family: 'Zen Maru Gothic', sans-serif; color: #5d4037; position: relative; overflow-x: hidden; }
        .star-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .star { position: absolute; color: #f59e0b; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10px); } 100% { transform: translateY(100vh); } }
        h1, h2 { font-family: 'Mochiy Pop One', sans-serif; }
        
        .card { transition: all 0.5s ease; position: relative; overflow: hidden; min-height: 220px; cursor: pointer; background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; }
        .card.active { background-color: #1f2937 !important; color: #ffffff !important; }
        .card.active h2 { color: #fce4ec !important; }
        .card.active p { color: #e5e7eb !important; }

        .animal-icon { display: inline-block; font-size: 3rem; margin-right: 1rem; transition: transform 0.5s ease; }
        @keyframes animalRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes animalSwing { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-3deg); } 75% { transform: translateX(5px) rotate(3deg); } }
        @keyframes animalJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .card:hover .animal-chick, .card.active .animal-chick { animation: animalRotate 1s ease-in-out; }
        .card:hover .animal-dog, .card.active .animal-dog { animation: animalSwing 1.5s ease-in-out infinite; }
        .card:hover .animal-cat, .card.active .animal-cat { animation: animalJump 0.8s ease-in-out infinite; }
        .card:hover .animal-hatch, .card.active .animal-hatch { animation: animalRotate 1s ease-in-out; }

        .action-container { position: absolute; bottom: 20px; left: 64px; opacity: 0; visibility: hidden; transition: all 0.3s ease; display: flex; flex-wrap: wrap; gap: 8px; }
        .card:hover .action-container, .card.active .action-container { opacity: 1; visibility: visible; }
        
        .typing-container { min-height: 3em; }
        .typing { display: inline-block; overflow: hidden; white-space: nowrap; width: 0; border-right: .15em solid transparent; }
        .card.active .typing { animation: typing 2s steps(40, end) forwards; border-right: .15em solid #fce4ec; }
        @keyframes typing { from { width: 0 } to { width: 100% } }

        #zoom-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; }
        #zoom-animal { font-size: 10rem; animation: zoomIn 0.8s ease-out; }
        @keyframes zoomIn { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="py-12 px-4 sm:px-6 lg:px-8">

    <div class="star-bg" id="star-container"></div>
    <div id="zoom-overlay" onclick="this.style.display='none'">
        <div id="zoom-animal"></div>
        <p class="text-white mt-4 text-2xl font-bold">実験へ移動します...</p>
    </div>

    <div class="max-w-3xl mx-auto relative z-10">
        <header class="text-center mb-12">
            <h1 class="text-3xl sm:text-4xl font-bold text-pink-400 mb-4 tracking-tight">
                尚絅学院大学 2412A22的<br>心理学者のたまご研究所🐣
            </h1>
        </header>

        <main class="grid gap-6">
            <!-- Experiments list... -->
            <section class="card p-6 rounded-3xl border-4 border-pink-100 shadow-sm" onmouseover="this.classList.add('active')" onmouseout="this.classList.remove('active')" ontouchstart="this.classList.toggle('active')">
                <div class="flex items-center mb-2"><span class="animal-icon animal-chick">🐤</span><h2 class="text-xl font-bold">実験0：はじめてのWebページ</h2></div>
                <div class="typing-container ml-16"><p class="typing">第2回で作成した記念すべき「Hello World」のページです。</p></div>
                <div class="action-container"><button onclick="triggerZoom('🐤', 'hello_world.html')" class="px-6 py-2 bg-pink-300 text-white font-bold rounded-full">実験0へ進む</button></div>
            </section>

            <section class="card p-6 rounded-3xl border-4 border-purple-100 shadow-sm" onmouseover="this.classList.add('active')" onmouseout="this.classList.remove('active')" ontouchstart="this.classList.toggle('active')">
                <div class="flex items-center mb-2"><span class="animal-icon animal-dog">🐶</span><h2 class="text-xl font-bold">実験1：ストループ課題</h2></div>
                <div class="typing-container ml-16"><p class="typing">文字の意味と色が違うとき、脳はどう反応するでしょうか？</p></div>
                <div class="action-container">
                    <button onclick="triggerZoom('🐶', 'stroop.html')" class="px-5 py-2 bg-purple-300 text-white font-bold rounded-full">実験1へ進む</button>
                    <a href="my_presentation.html" class="px-4 py-2 border-2 border-purple-400 text-purple-700 font-bold rounded-full bg-white hover:bg-purple-50 transition">発表資料を見る</a>
                </div>
            </section>

            <section class="card p-6 rounded-3xl border-4 border-blue-100 shadow-sm" onmouseover="this.classList.add('active')" onmouseout="this.classList.remove('active')" ontouchstart="this.classList.toggle('active')">
                <div class="flex items-center mb-2"><span class="animal-icon animal-cat">🐈</span><h2 class="text-xl font-bold">実験2：ミュラー・リヤー錯視</h2></div>
                <div class="typing-container ml-16"><p class="typing">同じ長さの線なのに、なぜ違って見えるのかを探ります。</p></div>
                <div class="action-container"><button onclick="triggerZoom('🐈', 'muller_lyer_final.html')" class="px-6 py-2 bg-blue-300 text-white font-bold rounded-full">実験2へ進む</button></div>
            </section>

            <!-- Experiment 3: N-back task with updated links -->
            <section class="card p-6 rounded-3xl border-4 border-green-100 shadow-sm" onmouseover="this.classList.add('active')" onmouseout="this.classList.remove('active')" ontouchstart="this.classList.toggle('active')">
                <div class="flex items-center mb-2"><span class="animal-icon animal-hatch">🐣</span><h2 class="text-xl font-bold">実験3：N-back課題</h2></div>
                <div class="typing-container ml-16"><p class="typing">1-back/2-back課題によるワーキングメモリ測定です。</p></div>
                <div class="action-container">
                    <button onclick="triggerZoom('🐣', 'nback.html')" class="px-4 py-2 bg-green-500 text-white font-bold rounded-full">実験開始</button>
                    <a href="my_exp_report.html" class="px-4 py-2 border-2 border-green-500 text-green-700 font-bold rounded-full bg-white hover:bg-green-50 transition">レポートを読む</a>
                    <a href="https://github.com/re-katsu/my-experiment/blob/main/preregistration.md" target="_blank" class="px-4 py-2 border-2 border-green-500 text-green-700 font-bold rounded-full bg-white hover:bg-green-50 transition">プレレジ</a>
                </div>
            </section>
        </main>

        <footer class="mt-16 text-center text-sm text-gray-400">&copy; 2026 尚絅学院大学 心理学者のたまご研究所 2412A22</footer>
    </div>

    <script>
        const container = document.getElementById('star-container');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.innerHTML = '★'; star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.fontSize = (Math.random() * 15 + 10) + 'px';
            star.style.animationDuration = (Math.random() * 5 + 5) + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.opacity = Math.random() * 0.5 + 0.3;
            container.appendChild(star);
        }

        function triggerZoom(emoji, url) {
            const overlay = document.getElementById('zoom-overlay');
            document.getElementById('zoom-animal').innerHTML = emoji;
            overlay.style.display = 'flex';
            setTimeout(() => { window.location.href = url; }, 1500);
        }
    </script>
</body>
</html>
