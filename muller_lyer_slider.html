<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミュラー・リヤー錯視 調整法実験</title>
  <script src="https://unpkg.com/jspsych@7.3.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-slider-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css">

  <style>
    body { 
      background-color: #f8fafc; 
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; 
      line-height: 1.6;
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px 10px;
    }
    .jspsych-content { 
      max-width: 600px; 
      padding: 30px; 
      background: white; 
      border-radius: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      width: 100%;
    }
    h2 { margin: 10px 0; color: #1e293b; }
    p { margin: 5px 0 20px 0; font-size: 1.2rem; color: #334155; }
    canvas { border: 1px solid #e2e8f0; background: white; display: block; margin: 20px auto; border-radius: 8px; max-width: 100%; }
    
    .jspsych-btn { 
      font-size: 1.1rem; 
      padding: 15px 30px; 
      border-radius: 12px; 
      background-color: #2563eb; 
      color: white; 
      border: none;
      cursor: pointer;
    }
    .jspsych-btn:hover { background-color: #1d4ed8; }

    input[type=range] { width: 80%; max-width: 400px; margin: 20px 0; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 35px;
      height: 35px;
      background: gold;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      cursor: pointer;
    }
    .trial-counter { color: #64748b; font-size: 0.9rem; margin-bottom: 10px; }
    .cat-icon { font-size: 60px; display: block; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxMogK19nwS7aRksoYJlY61Qi39hZ_2FEVxe7HF90OhjDrlbTry9k9datAIG2mE5piL/exec';

    const jsPsych = initJsPsych({
      display_element: 'jspsych-target',
      on_finish: function() {
        const fullData = jsPsych.data.get().filter({trial_type: 'canvas-slider-response'});
        const subject_id = jsPsych.data.get().filterCustom(d => d.subject_id || d.response?.subject_id).values()[0].response.subject_id;
        const device_type = jsPsych.data.get().filterCustom(d => d.response?.device).values()[0].response.device;
        const total_time_ms = jsPsych.getTotalTime();
        const mins = Math.floor(total_time_ms / 60000);
        const secs = Math.floor((total_time_ms % 60000) / 1000);
        const time_str = `${mins}分${secs}秒`;
        
        const exportData = fullData.values().map(d => ({
          subject_id: subject_id,
          device: device_type,
          total_duration: time_str,
          timestamp: d.time_elapsed,
          angle: d.angle,
          wing_length: d.feather,
          pse: d.response,
          error_amount: Math.abs(d.response - 200)
        }));

        document.getElementById('jspsych-target').innerHTML = `
          <div class="jspsych-content">
            <h2>送信中...</h2>
            <p>データを送っています。しばらくお待ちください。</p>
          </div>`;

        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(exportData)
        }).then(() => {
          showFinalReport(subject_id, fullData.values(), time_str);
        }).catch(err => {
          document.getElementById('jspsych-target').innerHTML = `<div class="jspsych-content"><p style="color:red;">送信エラー: ${err.message}</p></div>`;
        });
      }
    });

    function showFinalReport(subject_id, data, time) {
      const conditions = [{a: 15, f: 20}, {a: 15, f: 50}, {a: 75, f: 20}, {a: 75, f: 50}];
      let html = `
        <div class="jspsych-content">
          <h2>ありがとうございました！</h2>
          <p>実験は終了です。ご協力感謝いたします。</p>
          <p style="font-size: 1rem;">所要時間: ${time}</p>
          <button class="jspsych-btn" onclick="location.reload()">最初からやり直す</button>
        </div>`;
      document.getElementById('jspsych-target').innerHTML = html;
    }

    function draw(c, length, angle, f_len) {
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      const centerX = c.width / 2;
      const angleRad = (angle * Math.PI) / 180;
      const drawLine = (y, len, inward) => {
        ctx.beginPath();
        ctx.moveTo(centerX - len/2, y); ctx.lineTo(centerX + len/2, y);
        const dir = inward ? 1 : -1;
        ctx.moveTo(centerX - len/2, y); ctx.lineTo(centerX - len/2 + f_len * Math.cos(angleRad) * dir, y - f_len * Math.sin(angleRad));
        ctx.moveTo(centerX - len/2, y); ctx.lineTo(centerX - len/2 + f_len * Math.cos(angleRad) * dir, y + f_len * Math.sin(angleRad));
        ctx.moveTo(centerX + len/2, y); ctx.lineTo(centerX + len/2 - f_len * Math.cos(angleRad) * dir, y - f_len * Math.sin(angleRad));
        ctx.moveTo(centerX + len/2, y); ctx.lineTo(centerX + len/2 - f_len * Math.cos(angleRad) * dir, y + f_len * Math.sin(angleRad));
        ctx.stroke();
      };
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
      drawLine(90, 200, true);
      drawLine(210, length, false);
    }

    const trials = jsPsych.randomization.shuffle([
      {angle: 15, feather: 20}, {angle: 15, feather: 50}, 
      {angle: 75, feather: 20}, {angle: 75, feather: 50}
    ].flatMap(i => Array(3).fill(i)));

    const timeline = [{
      type: jsPsychSurveyText,
      questions: [{ prompt: '<span class="cat-icon">🐱</span><strong>参加者IDを入力してください</strong>', name: "subject_id", required: true }],
      button_label: "次へ"
    }, {
      type: jsPsychSurveyMultiChoice,
      questions: [{ prompt: "<strong>お使いの端末を選んでください</strong>", options: ["パソコン", "スマホ", "タブレット"], name: "device", required: true }],
      button_label: "次へ"
    }, {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <h2>これからテストを始めます</h2>
        <p style="text-align: left;">ご協力ありがとうございます。<br>これから短い視覚のテストを行います。<br><br>
        画面に2つの「矢印のような図形」が上下に並んで表示されます。<br>下の図形は、スライダーを動かすと長さが変わります。<br><br>
        スライダーを左右に動かして、<strong>「上の横線」と「下の横線」がピッタリ同じ長さ</strong>に見えるところで、「決定」ボタンを押してください。</p>`,
      choices: ["実験開始"]
    }];

    trials.forEach((cond, idx) => {
      timeline.push({
        type: jsPsychCanvasSliderResponse,
        canvas_size: [300, 600],
        stimulus: (c) => draw(c, 200, cond.angle, cond.feather),
        min: 50, max: 350, step: 1, slider_start: 200,
        button_label: "決定",
        prompt: `<div class="trial-counter">現在 ${idx + 1} 回目 / 全 12 回</div>`,
        data: { angle: cond.angle, feather: cond.feather },
        on_load: function() {
          const slider = document.querySelector('input[type=range]');
          const canvas = document.querySelector('canvas');
          slider.oninput = (e) => draw(canvas, e.target.value, cond.angle, cond.feather);
        }
      });
    });

    jsPsych.run(timeline);
  </script>
</body>
</html>
