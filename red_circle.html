<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>jsPsych Red Circle Task</title>
  <!-- Load jsPsych v7 from CDN -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    /* 1. Background color set to gray */
    body {
      background-color: #808080;
      color: white; /* Make text readable on gray */
    }

    /* 2. Red circle styling (100px diameter) */
    .red-circle {
      width: 100px;
      height: 100px;
      background-color: #ff0000;
      border-radius: 50%;
      margin: 0 auto;
    }
    
    .instruction {
      margin-top: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body></body>
<script>
  // Initialize jsPsych
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Optional: Display results at the end
      // jsPsych.data.displayData();
    }
  });

  // Timeline setup
  const timeline = [];

  // Circle trial
  const display_red_circle = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="red-circle"></div>
      <div class="instruction">スペースキーを押すと終了します</div>
    `,
    // 3. Keep displaying until space key is pressed
    choices: [' '], 
    data: {
      task: 'red_circle_display'
    }
  };

  // 4. End message
  const end_message = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <p>終了しました。</p>
      <p>ご協力ありがとうございました。</p>
    `,
    choices: "NO_KEYS",
    trial_duration: 3000
  };

  timeline.push(display_red_circle);
  timeline.push(end_message);

  // Run the experiment
  jsPsych.run(timeline);
</script>
</html>
