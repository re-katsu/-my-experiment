<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミュラー・リヤー錯視 調整法実験</title>
  <script src="https://unpkg.com/jspsych@7.3.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-slider-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css">

  <style>
    body { 
      background-color: #fef3c7; 
      background-image: radial-gradient(#fcd34d 15%, transparent 16%),
                        radial-gradient(#fcd34d 15%, transparent 16%);
      background-size: 60px 60px;
      font-family: sans-serif; 
      display: flex; justify-content: center; align-items: flex-start; 
      min-height: 100vh; margin: 0; padding: 10px;
    }
    .jspsych-content { 
      max-width: 500px; width: 100%; padding: 20px; 
      background: rgba(255, 255, 255, 0.95); 
      border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
      text-align: center;
    }
    canvas { 
      border: 3px solid #f59e0b; background: white; 
      margin: 15px auto; border-radius: 15px;
      width: 100%; max-width: 400px; height: auto;
    }
    .jspsych-btn { 
      font-size: 1.1rem; padding: 15px 30px; border-radius: 40px; 
      background: #f59e0b; color: white; border: none; cursor: pointer;
      margin: 10px; width: 80%;
    }
    
    /* スマホ対応：スライダーつまみの完全リセット */
    input[type=range] { 
      -webkit-appearance: none; width: 90%; background: transparent; margin: 20px 0;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 10px; background: #fbbf24; border-radius: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 50px; width: 50px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🐤</text></svg>') no-repeat center;
      background-size: contain;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      cursor: pointer;
      margin-top: -20px;
    }
    
    .float-icon { animation: float 2s ease-in-out infinite; display: inline-block; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxMogK19nwS7aRksoYJlY61Qi39hZ_2FEVxe7HF90OhjDrlbTry9k9datAIG2mE5piL/exec';

    const jsPsych = initJsPsych({
      display_element: 'jspsych-target',
      on_finish: () => {
        document.getElementById('jspsych-target').innerHTML = '<div class="jspsych-content"><h2>送信完了！</h2><p>ありがとう🐤またね！</p></div>';
      }
    });

    let startTime;

    function draw(c, length, angle, f_len) {
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      const centerX = c.width / 2;
      const angleRad = (angle * Math.PI) / 180;
      
      const drawLine = (y, len, inward) => {
        ctx.beginPath();
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.moveTo(centerX - len/2, y); ctx.lineTo(centerX + len/2, y);
        const dir = inward ? 1 : -1;
        ctx.moveTo(centerX - len/2, y); ctx.lineTo(centerX - len/2 + f_len * Math.cos(angleRad) * dir, y - f_len * Math.sin(angleRad));
        ctx.moveTo(centerX - len/2, y); ctx.lineTo(centerX - len/2 + f_len * Math.cos(angleRad) * dir, y + f_len * Math.sin(angleRad));
        ctx.moveTo(centerX + len/2, y); ctx.lineTo(centerX + len/2 - f_len * Math.cos(angleRad) * dir, y - f_len * Math.sin(angleRad));
        ctx.moveTo(centerX + len/2, y); ctx.lineTo(centerX + len/2 - f_len * Math.cos(angleRad) * dir, y + f_len * Math.sin(angleRad));
        ctx.stroke();
      };
      drawLine(90, 200, true);
      drawLine(210, length, false);
    }

    const trials = jsPsych.randomization.shuffle([
      {angle: 15, feather: 20}, {angle: 15, feather: 50}, 
      {angle: 75, feather: 20}, {angle: 75, feather: 50}
    ].flatMap(i => Array(3).fill(i)));

    const timeline = [{
      type: jsPsychSurveyText,
      questions: [{ prompt: '<span class="float-icon" style="font-size:40px">🐣</span><br>IDを教えてね', name: "subject_id", required: true }],
      button_label: "次へ"
    }, {
      type: jsPsychSurveyMultiChoice,
      questions: [{ prompt: "機械を選んでね", options: ["パソコン", "スマホ", "タブレット"], name: "device", required: true }],
      button_label: "次へ"
    }, {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h3>実験スタート！</h3><p>スライダーの🐤を動かして、下の線を上の線と同じ長さに合わせてね！</p>`,
      choices: ["スタート🐤"],
      on_finish: () => { startTime = Date.now(); }
    }];

    trials.forEach((cond, idx) => {
      timeline.push({
        type: jsPsychCanvasSliderResponse,
        canvas_size: [300, 600],
        stimulus: (c) => draw(c, 200, cond.angle, cond.feather),
        min: 50, max: 350, step: 1, slider_start: 200,
        button_label: "決定🐤",
        prompt: `<p>あと ${12 - idx} 回！</p>`,
        on_load: function() {
          const s = document.querySelector('input[type=range]');
          const canvas = document.querySelector('canvas');
          s.addEventListener('input', (e) => requestAnimationFrame(() => draw(canvas, e.target.value, cond.angle, cond.feather)));
        }
      });
    });

    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: () => `<h2>お疲れ様！</h2><p>${Math.floor((Date.now() - startTime)/1000)} 秒かかったよ！</p>`,
      choices: ["送信する🐤"],
      on_finish: function() {
        const d = jsPsych.data.get().filter({trial_type: 'canvas-slider-response'}).values();
        fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d) });
      }
    });

    jsPsych.run(timeline);
  </script>
</body>
</html>
