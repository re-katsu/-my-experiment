<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task - Professional Edition</title>
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css">
    
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stimulus-text {
            font-size: 80px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        #crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .crack-line {
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 2;
            fill: none;
        }

        .instruction-text {
            font-size: 24px;
            line-height: 1.8;
            text-align: center;
        }

        .key-hint {
            padding: 2px 8px;
            border-radius: 4px;
            background: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
    <!-- ガラスのひび割れを描画するためのSVGコンテナ -->
    <svg id="crack-overlay"></svg>

    <script>

        // ガラスが割れる音を合成 (Tone.js)
        const playGlassBreakSound = () => {
            const noise = new Tone.Noise("white").start();
            const filter = new Tone.Filter(8000, "highpass").toDestination();
            const env = new Tone.AmplitudeEnvelope({
                attack: 0.001,
                decay: 0.3,
                sustain: 0,
                release: 0.1
            }).connect(filter);
            
            noise.connect(env);
            env.triggerAttackRelease(0.3);

            // 高音のキラキラした破片音を混ぜる
            const metal = new Tone.MetalSynth({
                frequency: 400,
                envelope: { attack: 0.001, decay: 0.2, release: 0.1 },
                harmonicity: 5.1,
                modulationIndex: 32,
                resonance: 4000,
                octaves: 1.5
            }).toDestination();
            metal.triggerAttackRelease("C6", "16n");
        };

        // 画面にひび割れを描画する関数
        const triggerCrackEffect = () => {
            const overlay = document.getElementById('crack-overlay');
            overlay.innerHTML = ''; // 以前のひびを消去
            overlay.style.opacity = '1';
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            const centerX = width / 2;
            const centerY = height / 2;

            // 中心から放射状に伸びるひびを作成
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
                const length = Math.max(width, height);
                const endX = centerX + Math.cos(angle) * length;
                const endY = centerY + Math.sin(angle) * length;
                
                const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                // ジグザグな線を生成
                let d = `M ${centerX} ${centerY}`;
                let currX = centerX;
                let currY = centerY;
                const segments = 5;
                for (let s = 1; s <= segments; s++) {
                    currX += (endX - centerX) / segments + (Math.random() - 0.5) * 100;
                    currY += (endY - centerY) / segments + (Math.random() - 0.5) * 100;
                    d += ` L ${currX} ${currY}`;
                }
                
                line.setAttribute("d", d);
                line.setAttribute("class", "crack-line");
                overlay.appendChild(line);
            }

            // 画面を少し揺らす
            document.body.style.transform = `translate(${(Math.random()-0.5)*20}px, ${(Math.random()-0.5)*20}px)`;
            
            // 一定時間で消去
            setTimeout(() => {
                overlay.style.opacity = '0';
                document.body.style.transform = 'translate(0, 0)';
            }, 400);
        };

        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                jsPsych.data.displayData('csv');
            }
        });

        const stimuli_pool = [
            { text: "RED", color: "red", condition: "congruent", correct_key: "r" },
            { text: "BLUE", color: "blue", condition: "congruent", correct_key: "b" },
            { text: "GREEN", color: "green", condition: "congruent", correct_key: "g" },
            { text: "RED", color: "blue", condition: "incongruent", correct_key: "b" },
            { text: "RED", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "BLUE", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "BLUE", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "GREEN", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "GREEN", color: "blue", condition: "incongruent", correct_key: "b" }
        ];

        const timeline = [];

        // 教示
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text">
                    <p>Identify the <span style="color: #FFD700; font-weight: bold;">COLOR</span> of the word.</p>
                    <div style="margin: 30px 0; text-align: left; display: inline-block;">
                        <p>・If the color is <span style="color:red">RED</span>: Press <span class="key-hint">R</span></p>
                        <p>・If the color is <span style="color:blue">BLUE</span>: Press <span class="key-hint">B</span></p>
                        <p>・If the color is <span style="color:green">GREEN</span>: Press <span class="key-hint">G</span></p>
                    </div>
                    <p>Be careful! Making a mistake will "break" the screen.</p>
                    <p style="margin-top: 30px; font-size: 20px; color: #aaa;">[ Press SPACE to Start ]</p>
                </div>
            `,
            choices: [' '],
            on_start: async () => {
                // Audioコンテキストの開始（ブラウザ制限対策）
                await Tone.start();
            }
        });

        // テスト手続き
        const test_procedure = {
            timeline: [
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: '<div style="font-size:60px;">+</div>',
                    choices: "NO_KEYS",
                    trial_duration: 500
                },
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: () => {
                        const text = jsPsych.timelineVariable('text');
                        const color = jsPsych.timelineVariable('color');
                        return `<div class="stimulus-text" style="color: ${color}">${text}</div>`;
                    },
                    choices: ['r', 'b', 'g'],
                    data: {
                        task: 'response',
                        correct_response: jsPsych.timelineVariable('correct_key'),
                        color_content: jsPsych.timelineVariable('color')
                    },
                    on_finish: function(data) {
                        data.correct = (data.response == data.correct_response);
                        
                        if (data.correct) {
                            // 正解：クラッカー
                            confetti({
                                particleCount: 80,
                                spread: 70,
                                origin: { y: 0.6 },
                                colors: [data.color_content, '#ffffff']
                            });
                        } else {
                            // 不正解：ガラス割れ演出
                            triggerCrackEffect();
                            playGlassBreakSound();
                        }
                    }
                },
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: '',
                    choices: "NO_KEYS",
                    trial_duration: 1000
                }
            ],
            timeline_variables: stimuli_pool,
            sample: { type: 'with-replacement', size: 10 }
        };
        timeline.push(test_procedure);

        window.onload = function() {
            jsPsych.run(timeline);
        };
    </script>
</body>
</html>
