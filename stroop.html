<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task - jsPsych</title>
    <!-- jsPsych 7.3.1 本体の読み込み -->
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <!-- プラグインの読み込み（キーボード反応） -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <!-- jsPsych スタイルの読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css">
    
    <style>
        body {
            background-color: #FFFFFF; /* 背景色: 白 */
            color: #333333;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; /* 指定フォント */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* jsPsych のターゲットコンテナ */
        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 教示テキストのサイズ設定 */
        .instruction-text {
            font-size: 24px;
            line-height: 1.6;
            text-align: center;
        }

        /* 刺激（文字）のサイズ設定 */
        .stimulus-text {
            font-size: 60px;
            font-weight: bold;
            user-select: none;
        }

        /* 注視点のスタイル */
        .fixation-text {
            font-size: 60px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // 実験終了時にデータをCSV形式で表示
                jsPsych.data.displayData('csv');
            }
        });

        // 文字と色の定義
        const stimuli_pool = [
            // 一致条件 (Congruent)
            { text: "赤", color: "red", condition: "congruent", correct_key: "r" },
            { text: "青", color: "blue", condition: "congruent", correct_key: "b" },
            { text: "緑", color: "green", condition: "congruent", correct_key: "g" },
            // 不一致条件 (Incongruent)
            { text: "赤", color: "blue", condition: "incongruent", correct_key: "b" },
            { text: "赤", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "青", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "青", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "緑", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "緑", color: "blue", condition: "incongruent", correct_key: "b" }
        ];

        const timeline = [];

        // 教示画面 (Fullscreenはエラー回避のため削除)
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text">
                    <p>文字の『色』をキーボードで答えてください。</p>
                    <p>赤色の文字なら <strong style="color:red"> 'r' </strong></p>
                    <p>青色の文字なら <strong style="color:blue"> 'b' </strong></p>
                    <p>緑色の文字なら <strong style="color:green"> 'g' </strong></p>
                    <br>
                    <p>準備ができたら<strong>スペースキー</strong>を押して開始します。</p>
                </div>
            `,
            choices: [' '],
            post_trial_gap: 500
        });

        const test_procedure = {
            // メイン試行ループ: 10回ランダムサンプリング
            timeline: [
                // a. 注視点 (+)
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: '<div class="fixation-text">+</div>',
                    choices: "NO_KEYS",
                    trial_duration: 500,
                    data: { task: 'fixation' }
                },
                // b. 刺激提示
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: function() {
                        const text = jsPsych.timelineVariable('text');
                        const color = jsPsych.timelineVariable('color');
                        return `<div class="stimulus-text" style="color: ${color}">${text}</div>`;
                    },
                    choices: ['r', 'b', 'g'],
                    data: {
                        task: 'response',
                        correct_response: jsPsych.timelineVariable('correct_key'),
                        condition: jsPsych.timelineVariable('condition'),
                        text_content: jsPsych.timelineVariable('text'),
                        color_content: jsPsych.timelineVariable('color')
                    },
                    on_finish: function(data) {
                        // 正誤判定
                        data.correct = (data.response == data.correct_response);
                    }
                },
                // c. 試行間隔 (ITI)
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: '',
                    choices: "NO_KEYS",
                    trial_duration: 1000,
                    data: { task: 'iti' }
                }
            ],
            timeline_variables: stimuli_pool,
            sample: {
                type: 'with-replacement', // 重複ありのランダム
                size: 10 // 合計10試行
            }
        };
        timeline.push(test_procedure);

        window.onload = function() {
            jsPsych.run(timeline);
        };
    </script>
</body>
</html>
